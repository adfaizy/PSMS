server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fresh service worker after deploy
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Optional hardening for a school intranet / public site
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
